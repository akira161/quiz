# Cloudflare Workers の設定（wrangler を使う場合）。ダッシュボードに貼り付けるだけでも動きます。
name = "quiz"
main = "notion-sync.js"
compatibility_date = "2024-11-01"

[vars]
ALLOWED_ORIGIN = "https://akira161.github.io"
NOTION_DATABASE_ID = "5ed7759baeb94c9fb3456d25ab95f776"
